name: Purely B
description: >-
  PurelyB is a natural superfood and wellness brand founded by Raja Jesrina Arshad,
  rooted in ancestral Asian health traditions and selling halal-certified, vegan,
  gluten-free herbal supplements (Pegaga, Tiger Milk Mushroom, Manjakani, Super
  Immune-C and a SuperKids line) direct to consumers across Malaysia and Singapore.
  The storefront runs on Shopify and exposes a standards-based agent-commerce
  surface: a Universal Commerce Protocol (UCP) merchant profile with a hosted MCP
  shopping server, Shopify Customer Account OAuth/OIDC, and a published llms.txt for
  AI shopping agents. Surfaced as a 500 Global portfolio company and enriched from
  its public developer/agent surface.
